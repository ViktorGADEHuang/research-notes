
site_name: Viktor's Research Notes
site_description: 个人科研与技术学习知识库
site_author: Viktor


theme:
  name: material
  language: zh

  palette:
    # 浅色模式
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式

    # 深色模式
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - content.code.copy


plugins:
  - search

# 内容变动时自动更新资源地址，避免浏览器继续使用旧样式。
hooks:
  - hooks/asset_versions.py

nav:
  - 首页: index.md

  - 强化学习:
      - 强化学习概览: rl/index.md
      - 入门第一课 · 用一次经历理解学习: rl/start.md
      - 网络与梯度入门 · 两个数字怎样学习: rl/network-basics.md
      - 第一部分 · 算法直觉:
          - 算法直觉导读: rl/intuition/index.md
          - 价值迭代: rl/intuition/value-iteration.md
          - 蒙特卡洛（MC）: rl/intuition/mc.md
          - 时序差分 TD(0): rl/intuition/td.md
          - SARSA: rl/intuition/sarsa.md
          - Q-learning: rl/intuition/q-learning.md
          - DQN: rl/intuition/dqn.md
          - REINFORCE: rl/intuition/reinforce.md
          - Actor-Critic / A2C: rl/intuition/a2c.md
          - PPO: rl/intuition/ppo.md
          - DDPG: rl/intuition/ddpg.md
          - TD3: rl/intuition/td3.md
          - SAC: rl/intuition/sac.md
      - 第二部分 · 公式讲解:
          - 公式讲解导读: rl/math/index.md
          - 价值迭代: rl/math/value-iteration.md
          - 蒙特卡洛（MC）: rl/math/mc.md
          - 时序差分 TD(0): rl/math/td.md
          - SARSA: rl/math/sarsa.md
          - Q-learning: rl/math/q-learning.md
          - DQN: rl/math/dqn.md
          - REINFORCE: rl/math/reinforce.md
          - Actor-Critic / A2C: rl/math/a2c.md
          - PPO: rl/math/ppo.md
          - DDPG: rl/math/ddpg.md
          - TD3: rl/math/td3.md
          - SAC: rl/math/sac.md
      - 第三部分 · 编程实践:
          - 编程实践导读: rl/code/index.md
          - 价值迭代: rl/code/value-iteration.md
          - 蒙特卡洛（MC）: rl/code/mc.md
          - 时序差分 TD(0): rl/code/td.md
          - SARSA: rl/code/sarsa.md
          - Q-learning: rl/code/q-learning.md
          - DQN: rl/code/dqn.md
          - REINFORCE: rl/code/reinforce.md
          - Actor-Critic / A2C: rl/code/a2c.md
          - PPO: rl/code/ppo.md
          - DDPG: rl/code/ddpg.md
          - TD3: rl/code/td3.md
          - SAC: rl/code/sac.md
      - PPO 与放牧任务: rl/ppo.md

