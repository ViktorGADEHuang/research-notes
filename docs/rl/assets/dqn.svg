<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title description"><title id="title">DQN：用网络学习动作分数</title><desc id="description">1. 交互并保存经验，记录状态、动作与奖励，也保存下一状态和终止；2. 随机抽一批记录，从经验回放池抽样，减少相邻记录的相关性；3. 目标网络给目标分，下一状态最高 Q 值，用于计算学习目标；4. 训练当前 Q 网络，让预测更接近目标，隔一段时间同步目标网络。关键：当前网络在学，目标网络慢一点跟进。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64877a"/></marker></defs><rect width="1000" height="760" rx="24" fill="#f4f7f0"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#203e35"><text x="40" y="68" font-size="36" font-weight="700" fill="#203e35" text-anchor="start">DQN：用网络学习动作分数</text><text x="40" y="108" font-size="24" font-weight="400" fill="#5c7065" text-anchor="start">沿箭头读：先看发生了什么，再看更新了什么。</text><rect x="40" y="150" width="430" height="210" rx="16" fill="#fff" stroke="#d5e1d6" stroke-width="2"/><circle cx="76" cy="190" r="20" fill="#315e55"/><text x="76" y="199" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="108" y="200" font-size="28" font-weight="700" fill="#203e35" text-anchor="start">交互并保存经验</text><text x="66" y="265" font-size="25" font-weight="400" fill="#203e35" text-anchor="start">记录状态、动作与奖励</text><text x="66" y="307" font-size="25" font-weight="400" fill="#5c7065" text-anchor="start">也保存下一状态和终止</text><rect x="530" y="150" width="430" height="210" rx="16" fill="#fff" stroke="#d5e1d6" stroke-width="2"/><circle cx="566" cy="190" r="20" fill="#315e55"/><text x="566" y="199" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="598" y="200" font-size="28" font-weight="700" fill="#203e35" text-anchor="start">随机抽一批记录</text><text x="556" y="265" font-size="25" font-weight="400" fill="#203e35" text-anchor="start">从经验回放池抽样</text><text x="556" y="307" font-size="25" font-weight="400" fill="#5c7065" text-anchor="start">减少相邻记录的相关性</text><rect x="530" y="410" width="430" height="210" rx="16" fill="#fff" stroke="#d5e1d6" stroke-width="2"/><circle cx="566" cy="450" r="20" fill="#315e55"/><text x="566" y="459" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="598" y="460" font-size="28" font-weight="700" fill="#203e35" text-anchor="start">目标网络给目标分</text><text x="556" y="525" font-size="25" font-weight="400" fill="#203e35" text-anchor="start">下一状态最高 Q 值</text><text x="556" y="567" font-size="25" font-weight="400" fill="#5c7065" text-anchor="start">用于计算学习目标</text><rect x="40" y="410" width="430" height="210" rx="16" fill="#fff" stroke="#d5e1d6" stroke-width="2"/><circle cx="76" cy="450" r="20" fill="#315e55"/><text x="76" y="459" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="108" y="460" font-size="28" font-weight="700" fill="#203e35" text-anchor="start">训练当前 Q 网络</text><text x="66" y="525" font-size="25" font-weight="400" fill="#203e35" text-anchor="start">让预测更接近目标</text><text x="66" y="567" font-size="25" font-weight="400" fill="#5c7065" text-anchor="start">隔一段时间同步目标网络</text><path d="M475 255H518" fill="none" stroke="#64877a" stroke-width="3" marker-end="url(#arrow)"/><path d="M745 370V398" fill="none" stroke="#64877a" stroke-width="3" marker-end="url(#arrow)"/><path d="M525 515H482" fill="none" stroke="#64877a" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="656" width="920" height="76" rx="12" fill="#deead6"/><text x="60" y="704" font-size="24" font-weight="600" fill="#203e35" text-anchor="start">关键：当前网络在学，目标网络慢一点跟进。</text></g></svg>