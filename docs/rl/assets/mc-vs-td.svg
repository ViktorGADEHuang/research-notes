<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img"><title>MC等待完整回报，TD使用一步奖励加后续估计</title><rect width="1000" height="540" rx="24" fill="#f4f7f0"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="40" y="68" font-size="34" fill="#203e35" font-weight="700">MC 与 TD：什么时候更新，用什么反馈？</text><rect x="40" y="130" width="430" height="265" rx="16" fill="#fff" stroke="#c7d8cd"/><text x="64" y="189" font-size="31" fill="#203e35" font-weight="700">MC：等这一局结束</text><text x="64" y="247" font-size="26" fill="#203e35" font-weight="400">把之后实际得到的奖励加起来</text><text x="64" y="293" font-size="26" fill="#203e35" font-weight="400">用完整回报修正旧分数</text><text x="64" y="339" font-size="26" fill="#203e35" font-weight="400">不借用下一状态的价值估计</text><rect x="530" y="130" width="430" height="265" rx="16" fill="#fff" stroke="#c7d8cd"/><text x="554" y="189" font-size="31" fill="#203e35" font-weight="700">TD：走一步就可以更新</text><text x="554" y="247" font-size="26" fill="#203e35" font-weight="400">先拿到这一步的真实奖励</text><text x="554" y="293" font-size="26" fill="#203e35" font-weight="400">再加上下一状态的估计分数</text><text x="554" y="339" font-size="26" fill="#203e35" font-weight="400">未来部分还只是估计</text><text x="40" y="452" font-size="26" fill="#203e35" font-weight="400">两者都可以评估同一策略；这里区别是学习目标的来源。</text><text x="40" y="494" font-size="25" fill="#203e35" font-weight="400">TD 的“借用下一步估计”就叫自举，估计并不等于真实未来。</text></g></svg>