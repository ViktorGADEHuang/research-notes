<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title description"><title id="title">SAC：回报与探索一起考虑</title><desc id="description">1. 随机策略采样动作，不是一个固定的动作输出，收集并保存交互经验；2. 计算带熵的目标，双 Q 取小，再加入熵项，同时考虑收益和策略随机性；3. 更新价值与策略，Critic 拟合软目标，Actor 兼顾 Q 分数与熵；4. 温度调节熵的权重，本例由算法自动学习温度，下一批经验继续训练。关键：随机性进入学习目标，不只是外部添加噪声。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64877a"/></marker></defs><rect width="1000" height="760" rx="24" fill="#f4f7f0"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#203e35"><text x="40" y="68" font-size="36" font-weight="700" fill="#203e35" text-anchor="start">SAC：回报与探索一起考虑</text><text x="40" y="108" font-size="24" font-weight="400" fill="#5c7065" text-anchor="start">沿箭头读：先看发生了什么，再看更新了什么。</text><rect x="40" y="150" width="430" height="210" rx="16" fill="#fff" stroke="#d5e1d6" stroke-width="2"/><circle cx="76" cy="190" r="20" fill="#315e55"/><text x="76" y="199" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="108" y="200" font-size="28" font-weight="700" fill="#203e35" text-anchor="start">随机策略采样动作</text><text x="66" y="265" font-size="25" font-weight="400" fill="#203e35" text-anchor="start">不是一个固定的动作输出</text><text x="66" y="307" font-size="25" font-weight="400" fill="#5c7065" text-anchor="start">收集并保存交互经验</text><rect x="530" y="150" width="430" height="210" rx="16" fill="#fff" stroke="#d5e1d6" stroke-width="2"/><circle cx="566" cy="190" r="20" fill="#315e55"/><text x="566" y="199" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="598" y="200" font-size="28" font-weight="700" fill="#203e35" text-anchor="start">计算带熵的目标</text><text x="556" y="265" font-size="25" font-weight="400" fill="#203e35" text-anchor="start">双 Q 取小，再加入熵项</text><text x="556" y="307" font-size="25" font-weight="400" fill="#5c7065" text-anchor="start">同时考虑收益和策略随机性</text><rect x="530" y="410" width="430" height="210" rx="16" fill="#fff" stroke="#d5e1d6" stroke-width="2"/><circle cx="566" cy="450" r="20" fill="#315e55"/><text x="566" y="459" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="598" y="460" font-size="28" font-weight="700" fill="#203e35" text-anchor="start">更新价值与策略</text><text x="556" y="525" font-size="25" font-weight="400" fill="#203e35" text-anchor="start">Critic 拟合软目标</text><text x="556" y="567" font-size="25" font-weight="400" fill="#5c7065" text-anchor="start">Actor 兼顾 Q 分数与熵</text><rect x="40" y="410" width="430" height="210" rx="16" fill="#fff" stroke="#d5e1d6" stroke-width="2"/><circle cx="76" cy="450" r="20" fill="#315e55"/><text x="76" y="459" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="108" y="460" font-size="28" font-weight="700" fill="#203e35" text-anchor="start">温度调节熵的权重</text><text x="66" y="525" font-size="25" font-weight="400" fill="#203e35" text-anchor="start">本例由算法自动学习温度</text><text x="66" y="567" font-size="25" font-weight="400" fill="#5c7065" text-anchor="start">下一批经验继续训练</text><path d="M475 255H518" fill="none" stroke="#64877a" stroke-width="3" marker-end="url(#arrow)"/><path d="M745 370V398" fill="none" stroke="#64877a" stroke-width="3" marker-end="url(#arrow)"/><path d="M525 515H482" fill="none" stroke="#64877a" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="656" width="920" height="76" rx="12" fill="#deead6"/><text x="60" y="704" font-size="24" font-weight="600" fill="#203e35" text-anchor="start">关键：随机性进入学习目标，不只是外部添加噪声。</text></g></svg>