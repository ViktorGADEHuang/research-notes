<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title description"><title id="title">Q-learning：看下一步最高分</title><desc id="description">1. 执行当前动作，探索时可以随机尝试，收集奖励与下一状态；2. 查看下一状态的分数，两个动作值为 0.3、0.9，暂不管实际会选哪个；3. 取最高的分数，更新目标使用 0.9，相当于假设下一步贪心；4. 修正当前动作分数，向奖励 + 折扣后的 0.9 靠近，采样时依然可以探索。关键：采样可以探索，更新目标却使用最大 Q 值。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64877a"/></marker></defs><rect width="1000" height="760" rx="24" fill="#f4f7f0"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#203e35"><text x="40" y="68" font-size="36" font-weight="700" fill="#203e35" text-anchor="start">Q-learning：看下一步最高分</text><text x="40" y="108" font-size="24" font-weight="400" fill="#5c7065" text-anchor="start">沿箭头读：先看发生了什么，再看更新了什么。</text><rect x="40" y="150" width="430" height="210" rx="16" fill="#fff" stroke="#d5e1d6" stroke-width="2"/><circle cx="76" cy="190" r="20" fill="#315e55"/><text x="76" y="199" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="108" y="200" font-size="28" font-weight="700" fill="#203e35" text-anchor="start">执行当前动作</text><text x="66" y="265" font-size="25" font-weight="400" fill="#203e35" text-anchor="start">探索时可以随机尝试</text><text x="66" y="307" font-size="25" font-weight="400" fill="#5c7065" text-anchor="start">收集奖励与下一状态</text><rect x="530" y="150" width="430" height="210" rx="16" fill="#fff" stroke="#d5e1d6" stroke-width="2"/><circle cx="566" cy="190" r="20" fill="#315e55"/><text x="566" y="199" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="598" y="200" font-size="28" font-weight="700" fill="#203e35" text-anchor="start">查看下一状态的分数</text><text x="556" y="265" font-size="25" font-weight="400" fill="#203e35" text-anchor="start">两个动作值为 0.3、0.9</text><text x="556" y="307" font-size="25" font-weight="400" fill="#5c7065" text-anchor="start">暂不管实际会选哪个</text><rect x="530" y="410" width="430" height="210" rx="16" fill="#fff" stroke="#d5e1d6" stroke-width="2"/><circle cx="566" cy="450" r="20" fill="#315e55"/><text x="566" y="459" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="598" y="460" font-size="28" font-weight="700" fill="#203e35" text-anchor="start">取最高的分数</text><text x="556" y="525" font-size="25" font-weight="400" fill="#203e35" text-anchor="start">更新目标使用 0.9</text><text x="556" y="567" font-size="25" font-weight="400" fill="#5c7065" text-anchor="start">相当于假设下一步贪心</text><rect x="40" y="410" width="430" height="210" rx="16" fill="#fff" stroke="#d5e1d6" stroke-width="2"/><circle cx="76" cy="450" r="20" fill="#315e55"/><text x="76" y="459" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="108" y="460" font-size="28" font-weight="700" fill="#203e35" text-anchor="start">修正当前动作分数</text><text x="66" y="525" font-size="25" font-weight="400" fill="#203e35" text-anchor="start">向奖励 + 折扣后的 0.9 靠近</text><text x="66" y="567" font-size="25" font-weight="400" fill="#5c7065" text-anchor="start">采样时依然可以探索</text><path d="M475 255H518" fill="none" stroke="#64877a" stroke-width="3" marker-end="url(#arrow)"/><path d="M745 370V398" fill="none" stroke="#64877a" stroke-width="3" marker-end="url(#arrow)"/><path d="M525 515H482" fill="none" stroke="#64877a" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="656" width="920" height="76" rx="12" fill="#deead6"/><text x="60" y="704" font-size="24" font-weight="600" fill="#203e35" text-anchor="start">关键：采样可以探索，更新目标却使用最大 Q 值。</text></g></svg>