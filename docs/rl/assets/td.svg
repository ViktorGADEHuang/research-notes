<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title description"><title id="title">TD(0)：刚走一步就评分</title><desc id="description">1. 记住旧估计，当前状态原来值 0.3，这是尚未修正的分数；2. 走一步看奖励，本次奖励是 −0.01，下一状态估计为 0.8；3. 算一步学习目标，−0.01 + 0.95 × 0.8，目标等于 0.75；4. 向目标挪一点，0.3 + 0.1 × (0.75 − 0.3)，新估计变成 0.345。关键：未来部分借用自己的估计，因此不必等一局结束。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64877a"/></marker></defs><rect width="1000" height="760" rx="24" fill="#f4f7f0"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#203e35"><text x="40" y="68" font-size="36" font-weight="700" fill="#203e35" text-anchor="start">TD(0)：刚走一步就评分</text><text x="40" y="108" font-size="24" font-weight="400" fill="#5c7065" text-anchor="start">沿箭头读：先看发生了什么，再看更新了什么。</text><rect x="40" y="150" width="430" height="210" rx="16" fill="#fff" stroke="#d5e1d6" stroke-width="2"/><circle cx="76" cy="190" r="20" fill="#315e55"/><text x="76" y="199" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="108" y="200" font-size="28" font-weight="700" fill="#203e35" text-anchor="start">记住旧估计</text><text x="66" y="265" font-size="25" font-weight="400" fill="#203e35" text-anchor="start">当前状态原来值 0.3</text><text x="66" y="307" font-size="25" font-weight="400" fill="#5c7065" text-anchor="start">这是尚未修正的分数</text><rect x="530" y="150" width="430" height="210" rx="16" fill="#fff" stroke="#d5e1d6" stroke-width="2"/><circle cx="566" cy="190" r="20" fill="#315e55"/><text x="566" y="199" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="598" y="200" font-size="28" font-weight="700" fill="#203e35" text-anchor="start">走一步看奖励</text><text x="556" y="265" font-size="25" font-weight="400" fill="#203e35" text-anchor="start">本次奖励是 −0.01</text><text x="556" y="307" font-size="25" font-weight="400" fill="#5c7065" text-anchor="start">下一状态估计为 0.8</text><rect x="530" y="410" width="430" height="210" rx="16" fill="#fff" stroke="#d5e1d6" stroke-width="2"/><circle cx="566" cy="450" r="20" fill="#315e55"/><text x="566" y="459" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="598" y="460" font-size="28" font-weight="700" fill="#203e35" text-anchor="start">算一步学习目标</text><text x="556" y="525" font-size="25" font-weight="400" fill="#203e35" text-anchor="start">−0.01 + 0.95 × 0.8</text><text x="556" y="567" font-size="25" font-weight="400" fill="#5c7065" text-anchor="start">目标等于 0.75</text><rect x="40" y="410" width="430" height="210" rx="16" fill="#fff" stroke="#d5e1d6" stroke-width="2"/><circle cx="76" cy="450" r="20" fill="#315e55"/><text x="76" y="459" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="108" y="460" font-size="28" font-weight="700" fill="#203e35" text-anchor="start">向目标挪一点</text><text x="66" y="525" font-size="25" font-weight="400" fill="#203e35" text-anchor="start">0.3 + 0.1 × (0.75 − 0.3)</text><text x="66" y="567" font-size="25" font-weight="400" fill="#5c7065" text-anchor="start">新估计变成 0.345</text><path d="M475 255H518" fill="none" stroke="#64877a" stroke-width="3" marker-end="url(#arrow)"/><path d="M745 370V398" fill="none" stroke="#64877a" stroke-width="3" marker-end="url(#arrow)"/><path d="M525 515H482" fill="none" stroke="#64877a" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="656" width="920" height="76" rx="12" fill="#deead6"/><text x="60" y="704" font-size="24" font-weight="600" fill="#203e35" text-anchor="start">关键：未来部分借用自己的估计，因此不必等一局结束。</text></g></svg>