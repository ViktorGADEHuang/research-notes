<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title description"><title id="title">价值迭代：拿着规则计算</title><desc id="description">1. 读取各位置分数，先用当前的价值估计，作为这一轮计算的起点；2. 枚举每一个动作，规则告诉你会去哪里，算奖励 + 下一位置价值；3. 选最高的目标分数，比较各动作的期望收益，当前状态取最大的值；4. 更新一整轮分数，把结果传向更远的状态，继续计算，直到变化很小。关键：环境规则已知；这是计算规划，不是试错采样。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64877a"/></marker></defs><rect width="1000" height="760" rx="24" fill="#f4f7f0"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#203e35"><text x="40" y="68" font-size="36" font-weight="700" fill="#203e35" text-anchor="start">价值迭代：拿着规则计算</text><text x="40" y="108" font-size="24" font-weight="400" fill="#5c7065" text-anchor="start">沿箭头读：先看发生了什么，再看更新了什么。</text><rect x="40" y="150" width="430" height="210" rx="16" fill="#fff" stroke="#d5e1d6" stroke-width="2"/><circle cx="76" cy="190" r="20" fill="#315e55"/><text x="76" y="199" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="108" y="200" font-size="28" font-weight="700" fill="#203e35" text-anchor="start">读取各位置分数</text><text x="66" y="265" font-size="25" font-weight="400" fill="#203e35" text-anchor="start">先用当前的价值估计</text><text x="66" y="307" font-size="25" font-weight="400" fill="#5c7065" text-anchor="start">作为这一轮计算的起点</text><rect x="530" y="150" width="430" height="210" rx="16" fill="#fff" stroke="#d5e1d6" stroke-width="2"/><circle cx="566" cy="190" r="20" fill="#315e55"/><text x="566" y="199" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="598" y="200" font-size="28" font-weight="700" fill="#203e35" text-anchor="start">枚举每一个动作</text><text x="556" y="265" font-size="25" font-weight="400" fill="#203e35" text-anchor="start">规则告诉你会去哪里</text><text x="556" y="307" font-size="25" font-weight="400" fill="#5c7065" text-anchor="start">算奖励 + 下一位置价值</text><rect x="530" y="410" width="430" height="210" rx="16" fill="#fff" stroke="#d5e1d6" stroke-width="2"/><circle cx="566" cy="450" r="20" fill="#315e55"/><text x="566" y="459" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="598" y="460" font-size="28" font-weight="700" fill="#203e35" text-anchor="start">选最高的目标分数</text><text x="556" y="525" font-size="25" font-weight="400" fill="#203e35" text-anchor="start">比较各动作的期望收益</text><text x="556" y="567" font-size="25" font-weight="400" fill="#5c7065" text-anchor="start">当前状态取最大的值</text><rect x="40" y="410" width="430" height="210" rx="16" fill="#fff" stroke="#d5e1d6" stroke-width="2"/><circle cx="76" cy="450" r="20" fill="#315e55"/><text x="76" y="459" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="108" y="460" font-size="28" font-weight="700" fill="#203e35" text-anchor="start">更新一整轮分数</text><text x="66" y="525" font-size="25" font-weight="400" fill="#203e35" text-anchor="start">把结果传向更远的状态</text><text x="66" y="567" font-size="25" font-weight="400" fill="#5c7065" text-anchor="start">继续计算，直到变化很小</text><path d="M475 255H518" fill="none" stroke="#64877a" stroke-width="3" marker-end="url(#arrow)"/><path d="M745 370V398" fill="none" stroke="#64877a" stroke-width="3" marker-end="url(#arrow)"/><path d="M525 515H482" fill="none" stroke="#64877a" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="656" width="920" height="76" rx="12" fill="#deead6"/><text x="60" y="704" font-size="24" font-weight="600" fill="#203e35" text-anchor="start">关键：环境规则已知；这是计算规划，不是试错采样。</text></g></svg>