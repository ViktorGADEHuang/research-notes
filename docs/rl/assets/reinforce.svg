<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title description"><title id="title">REINFORCE：直接改动作概率</title><desc id="description">1. 按动作概率走完一局，策略给出向左向右概率，按概率采样，不总选最大；2. 算每一步之后的回报，从轨迹末尾往前累加，得到这局的反馈；3. 计算概率怎样调整，用采样时的旧动作概率，回报给调整方向加权；4. 整局算完再改策略，更新动作的偏好参数，下一局使用新的概率。关键：学的是动作概率；本例不用 Q 表，也没有价值基线。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64877a"/></marker></defs><rect width="1000" height="760" rx="24" fill="#f4f7f0"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#203e35"><text x="40" y="68" font-size="36" font-weight="700" fill="#203e35" text-anchor="start">REINFORCE：直接改动作概率</text><text x="40" y="108" font-size="24" font-weight="400" fill="#5c7065" text-anchor="start">沿箭头读：先看发生了什么，再看更新了什么。</text><rect x="40" y="150" width="430" height="210" rx="16" fill="#fff" stroke="#d5e1d6" stroke-width="2"/><circle cx="76" cy="190" r="20" fill="#315e55"/><text x="76" y="199" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="108" y="200" font-size="28" font-weight="700" fill="#203e35" text-anchor="start">按动作概率走完一局</text><text x="66" y="265" font-size="25" font-weight="400" fill="#203e35" text-anchor="start">策略给出向左向右概率</text><text x="66" y="307" font-size="25" font-weight="400" fill="#5c7065" text-anchor="start">按概率采样，不总选最大</text><rect x="530" y="150" width="430" height="210" rx="16" fill="#fff" stroke="#d5e1d6" stroke-width="2"/><circle cx="566" cy="190" r="20" fill="#315e55"/><text x="566" y="199" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="598" y="200" font-size="28" font-weight="700" fill="#203e35" text-anchor="start">算每一步之后的回报</text><text x="556" y="265" font-size="25" font-weight="400" fill="#203e35" text-anchor="start">从轨迹末尾往前累加</text><text x="556" y="307" font-size="25" font-weight="400" fill="#5c7065" text-anchor="start">得到这局的反馈</text><rect x="530" y="410" width="430" height="210" rx="16" fill="#fff" stroke="#d5e1d6" stroke-width="2"/><circle cx="566" cy="450" r="20" fill="#315e55"/><text x="566" y="459" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="598" y="460" font-size="28" font-weight="700" fill="#203e35" text-anchor="start">计算概率怎样调整</text><text x="556" y="525" font-size="25" font-weight="400" fill="#203e35" text-anchor="start">用采样时的旧动作概率</text><text x="556" y="567" font-size="25" font-weight="400" fill="#5c7065" text-anchor="start">回报给调整方向加权</text><rect x="40" y="410" width="430" height="210" rx="16" fill="#fff" stroke="#d5e1d6" stroke-width="2"/><circle cx="76" cy="450" r="20" fill="#315e55"/><text x="76" y="459" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="108" y="460" font-size="28" font-weight="700" fill="#203e35" text-anchor="start">整局算完再改策略</text><text x="66" y="525" font-size="25" font-weight="400" fill="#203e35" text-anchor="start">更新动作的偏好参数</text><text x="66" y="567" font-size="25" font-weight="400" fill="#5c7065" text-anchor="start">下一局使用新的概率</text><path d="M475 255H518" fill="none" stroke="#64877a" stroke-width="3" marker-end="url(#arrow)"/><path d="M745 370V398" fill="none" stroke="#64877a" stroke-width="3" marker-end="url(#arrow)"/><path d="M525 515H482" fill="none" stroke="#64877a" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="656" width="920" height="76" rx="12" fill="#deead6"/><text x="60" y="704" font-size="24" font-weight="600" fill="#203e35" text-anchor="start">关键：学的是动作概率；本例不用 Q 表，也没有价值基线。</text></g></svg>