<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title description"><title id="title">同一条走廊，理解不同学习方法</title><desc id="description">七个位置从0到6，起点3，左端终止奖励负1，右端终止奖励正1。中间移动奖励负0.01。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64877a"/></marker></defs><rect width="1000" height="440" rx="24" fill="#f4f7f0"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#203e35"><text x="40" y="68" font-size="36" font-weight="700" fill="#203e35" text-anchor="start">同一条走廊，先弄清楚环境</text><text x="40" y="110" font-size="26" font-weight="400" fill="#5c7065" text-anchor="start">动作 0 向左，动作 1 向右；到达 0 或 6 后结束。</text><rect x="40" y="165" width="110" height="100" rx="16" fill="#f4ded5" stroke="#b9cec1"/><text x="95" y="229" font-size="42" font-weight="700" fill="#203e35" text-anchor="middle">0</text><text x="162" y="225" font-size="25" font-weight="400" fill="#203e35" text-anchor="middle">↔</text><rect x="175" y="165" width="110" height="100" rx="16" fill="#fff" stroke="#b9cec1"/><text x="230" y="229" font-size="42" font-weight="700" fill="#203e35" text-anchor="middle">1</text><text x="297" y="225" font-size="25" font-weight="400" fill="#203e35" text-anchor="middle">↔</text><rect x="310" y="165" width="110" height="100" rx="16" fill="#fff" stroke="#b9cec1"/><text x="365" y="229" font-size="42" font-weight="700" fill="#203e35" text-anchor="middle">2</text><text x="432" y="225" font-size="25" font-weight="400" fill="#203e35" text-anchor="middle">↔</text><rect x="445" y="165" width="110" height="100" rx="16" fill="#315e55" stroke="#b9cec1"/><text x="500" y="229" font-size="42" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="567" y="225" font-size="25" font-weight="400" fill="#203e35" text-anchor="middle">↔</text><rect x="580" y="165" width="110" height="100" rx="16" fill="#fff" stroke="#b9cec1"/><text x="635" y="229" font-size="42" font-weight="700" fill="#203e35" text-anchor="middle">4</text><text x="702" y="225" font-size="25" font-weight="400" fill="#203e35" text-anchor="middle">↔</text><rect x="715" y="165" width="110" height="100" rx="16" fill="#fff" stroke="#b9cec1"/><text x="770" y="229" font-size="42" font-weight="700" fill="#203e35" text-anchor="middle">5</text><text x="837" y="225" font-size="25" font-weight="400" fill="#203e35" text-anchor="middle">↔</text><rect x="850" y="165" width="110" height="100" rx="16" fill="#deead6" stroke="#b9cec1"/><text x="905" y="229" font-size="42" font-weight="700" fill="#203e35" text-anchor="middle">6</text><text x="95" y="307" font-size="26" font-weight="700" fill="#203e35" text-anchor="middle">奖励 −1</text><text x="500" y="307" font-size="26" font-weight="700" fill="#203e35" text-anchor="middle">起点</text><text x="905" y="307" font-size="26" font-weight="700" fill="#203e35" text-anchor="middle">奖励 +1</text><text x="40" y="381" font-size="27" font-weight="400" fill="#203e35" text-anchor="start">中间每步奖励 −0.01；终点那一步只给 −1 或 +1。</text></g></svg>