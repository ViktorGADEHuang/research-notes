<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img"><title>强化学习交互：观察、动作、环境反馈与更新</title><rect width="1000" height="660" rx="24" fill="#f4f7f0"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="40" y="68" font-size="34" fill="#203e35" font-weight="700">强化学习：做一次选择，收到反馈，再改进</text><rect x="40" y="150" width="430" height="170" rx="16" fill="#fff" stroke="#c7d8cd"/><text x="65" y="210" font-size="31" fill="#203e35" font-weight="700">机器人 / 决策者</text><text x="65" y="264" font-size="28" fill="#203e35" font-weight="400">根据观测选动作</text><rect x="530" y="150" width="430" height="170" rx="16" fill="#fff" stroke="#c7d8cd"/><text x="555" y="210" font-size="31" fill="#203e35" font-weight="700">环境 / 仿真场地</text><text x="555" y="264" font-size="28" fill="#203e35" font-weight="400">动作后产生新情况</text><rect x="530" y="400" width="430" height="170" rx="16" fill="#fff" stroke="#c7d8cd"/><text x="555" y="460" font-size="31" fill="#203e35" font-weight="700">新的观测与奖励</text><text x="555" y="514" font-size="28" fill="#203e35" font-weight="400">告诉你发生了什么</text><rect x="40" y="400" width="430" height="170" rx="16" fill="#fff" stroke="#c7d8cd"/><text x="65" y="460" font-size="31" fill="#203e35" font-weight="700">学习算法更新</text><text x="65" y="514" font-size="28" fill="#203e35" font-weight="400">调整分数或动作概率</text><text x="476" y="240" font-size="42" fill="#64877a" font-weight="400">→</text><text x="730" y="370" font-size="42" fill="#64877a" font-weight="400">↓</text><text x="478" y="493" font-size="42" fill="#64877a" font-weight="400">←</text><text x="228" y="372" font-size="42" fill="#64877a" font-weight="400">↑</text><text x="40" y="619" font-size="26" fill="#203e35" font-weight="400">奖励只是学习信号；最终仍要检查羊群是否到达目标区域。</text></g></svg>