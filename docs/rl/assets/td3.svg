<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title description"><title id="title">TD3：针对 DDPG 的三项改动</title><desc id="description">1. 先看要解决的问题，Critic 可能把动作分打太高，Actor 会追着错误高分跑；2. 目标使用双 Q 取小，两个目标分为 2.4、1.8，计算目标时使用 1.8；3. 给目标动作加小噪声，并把噪声和动作限制在范围内，让目标对邻近动作更平滑；4. Actor 不每次都更新，Critic 多学几次再更新策略，目标网络也按此节奏跟进。三项改动共同工作；图中序号用于阅读，不表示独立执行三遍。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64877a"/></marker></defs><rect width="1000" height="760" rx="24" fill="#f4f7f0"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#203e35"><text x="40" y="68" font-size="36" font-weight="700" fill="#203e35" text-anchor="start">TD3：针对 DDPG 的三项改动</text><text x="40" y="108" font-size="24" font-weight="400" fill="#5c7065" text-anchor="start">沿箭头读：先看发生了什么，再看更新了什么。</text><rect x="40" y="150" width="430" height="210" rx="16" fill="#fff" stroke="#d5e1d6" stroke-width="2"/><circle cx="76" cy="190" r="20" fill="#315e55"/><text x="76" y="199" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="108" y="200" font-size="28" font-weight="700" fill="#203e35" text-anchor="start">先看要解决的问题</text><text x="66" y="265" font-size="25" font-weight="400" fill="#203e35" text-anchor="start">Critic 可能把动作分打太高</text><text x="66" y="307" font-size="25" font-weight="400" fill="#5c7065" text-anchor="start">Actor 会追着错误高分跑</text><rect x="530" y="150" width="430" height="210" rx="16" fill="#fff" stroke="#d5e1d6" stroke-width="2"/><circle cx="566" cy="190" r="20" fill="#315e55"/><text x="566" y="199" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="598" y="200" font-size="28" font-weight="700" fill="#203e35" text-anchor="start">目标使用双 Q 取小</text><text x="556" y="265" font-size="25" font-weight="400" fill="#203e35" text-anchor="start">两个目标分为 2.4、1.8</text><text x="556" y="307" font-size="25" font-weight="400" fill="#5c7065" text-anchor="start">计算目标时使用 1.8</text><rect x="530" y="410" width="430" height="210" rx="16" fill="#fff" stroke="#d5e1d6" stroke-width="2"/><circle cx="566" cy="450" r="20" fill="#315e55"/><text x="566" y="459" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="598" y="460" font-size="28" font-weight="700" fill="#203e35" text-anchor="start">给目标动作加小噪声</text><text x="556" y="525" font-size="25" font-weight="400" fill="#203e35" text-anchor="start">并把噪声和动作限制在范围内</text><text x="556" y="567" font-size="25" font-weight="400" fill="#5c7065" text-anchor="start">让目标对邻近动作更平滑</text><rect x="40" y="410" width="430" height="210" rx="16" fill="#fff" stroke="#d5e1d6" stroke-width="2"/><circle cx="76" cy="450" r="20" fill="#315e55"/><text x="76" y="459" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="108" y="460" font-size="28" font-weight="700" fill="#203e35" text-anchor="start">Actor 不每次都更新</text><text x="66" y="525" font-size="25" font-weight="400" fill="#203e35" text-anchor="start">Critic 多学几次再更新策略</text><text x="66" y="567" font-size="25" font-weight="400" fill="#5c7065" text-anchor="start">目标网络也按此节奏跟进</text><path d="M475 255H518" fill="none" stroke="#64877a" stroke-width="3" marker-end="url(#arrow)"/><path d="M745 370V398" fill="none" stroke="#64877a" stroke-width="3" marker-end="url(#arrow)"/><path d="M525 515H482" fill="none" stroke="#64877a" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="656" width="920" height="76" rx="12" fill="#deead6"/><text x="60" y="704" font-size="24" font-weight="600" fill="#203e35" text-anchor="start">三项改动共同工作；图中序号用于阅读，不表示独立执行三遍。</text></g></svg>