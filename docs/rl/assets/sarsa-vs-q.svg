<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="title description"><title id="title">SARSA与Q-learning如何使用下一状态的动作分数</title><desc id="description">下一状态两个动作值0.3与0.9，实际选择0.3。SARSA目标0.37新值0.394，Q-learning目标0.91新值0.502。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64877a"/></marker></defs><rect width="1000" height="680" rx="24" fill="#f4f7f0"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#203e35"><text x="40" y="68" font-size="36" font-weight="700" fill="#203e35" text-anchor="start">同一条经历，两个不同的学习目标</text><text x="40" y="114" font-size="25" font-weight="400" fill="#5c7065" text-anchor="start">旧 Q = 0.4，奖励 = 0.1，折扣 = 0.9，学习率 = 0.2</text><rect x="80" y="153" width="390" height="125" rx="16" fill="#deead6" stroke="#b9cec1"/><text x="275" y="200" font-size="28" font-weight="700" fill="#203e35" text-anchor="middle">实际选中的动作</text><text x="275" y="249" font-size="34" font-weight="700" fill="#203e35" text-anchor="middle">Q = 0.3</text><rect x="530" y="153" width="390" height="125" rx="16" fill="#fff" stroke="#b9cec1"/><text x="725" y="200" font-size="28" font-weight="700" fill="#203e35" text-anchor="middle">另一个动作</text><text x="725" y="249" font-size="34" font-weight="700" fill="#203e35" text-anchor="middle">Q = 0.9</text><rect x="40" y="340" width="430" height="230" rx="16" fill="#fff" stroke="#d5e1d6"/><text x="60" y="390" font-size="27" font-weight="700" fill="#203e35" text-anchor="start">SARSA：使用实际选中项</text><text x="60" y="446" font-size="24" font-weight="400" fill="#203e35" text-anchor="start">目标 = 0.1 + 0.9 × 0.3 = 0.37</text><text x="60" y="493" font-size="22" font-weight="400" fill="#203e35" text-anchor="start">新 Q = 0.4 + 0.2 × (0.37 − 0.4)</text><text x="60" y="545" font-size="32" font-weight="700" fill="#203e35" text-anchor="start">结果：0.394</text><rect x="530" y="340" width="430" height="230" rx="16" fill="#fff" stroke="#d5e1d6"/><text x="550" y="390" font-size="27" font-weight="700" fill="#203e35" text-anchor="start">Q-learning：使用最高分</text><text x="550" y="446" font-size="24" font-weight="400" fill="#203e35" text-anchor="start">目标 = 0.1 + 0.9 × 0.9 = 0.91</text><text x="550" y="493" font-size="22" font-weight="400" fill="#203e35" text-anchor="start">新 Q = 0.4 + 0.2 × (0.91 − 0.4)</text><text x="550" y="545" font-size="32" font-weight="700" fill="#203e35" text-anchor="start">结果：0.502</text><text x="40" y="630" font-size="26" font-weight="400" fill="#203e35" text-anchor="start">不是谁的值更大谁就一定更好；两者在学习不同的策略目标。</text></g></svg>