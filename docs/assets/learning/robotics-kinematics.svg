<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690" role="img" aria-labelledby="title desc">
  <title id="title">差速小车右轮快、左轮慢时向左转</title>
  <desc id="desc">俯视图中机身前方指上，左方指图中左。左轮前进速度零点一米每秒，右轮零点三，轮距零点五米，中点前进速度零点二米每秒、逆时针转向速度零点四弧度每秒。该模型不表示四足机器人。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#367660"/></marker></defs>
  <rect width="1100" height="690" rx="22" fill="#fff"/>
  <g font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#23463b">
    <text x="42" y="58" font-size="32" font-weight="700">差速小车：平均管前进，差值管转向</text>
    <text x="42" y="104" font-size="24" fill="#5d7269">平地纯滚动 · 两轮同半径 · 中点作为机身参考点</text>
    <rect x="168" y="293" width="294" height="222" rx="24" fill="#edf5eb" stroke="#cedcd5" stroke-width="2"/>
    <g fill="#367660"><rect x="139" y="365" width="48" height="104" rx="10"/><rect x="443" y="365" width="48" height="104" rx="10"/></g>
    <circle cx="315" cy="417" r="8" fill="#9b7a36"/>
    <g stroke="#367660" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M 163 349 V 285"/><path d="M 467 349 V 183"/>
      <path d="M 315 397 V 245"/><path d="M 292 417 H 221"/><path d="M 367 231 C 359 182 312 161 269 185"/></g>
    <g font-size="24"><text x="74" y="255">左 0.1 m/s</text><text x="416" y="159">右 0.3 m/s</text><text x="328" y="270">x：前</text><text x="209" y="453">y：左</text>
      <text x="197" y="143">左转：ω 为正</text></g>
    <g stroke="#9aaea0" stroke-width="2"><path d="M 163 532 V 559 M 467 532 V 559 M 163 546 H 467"/></g>
    <text x="211" y="587" font-size="25">轮距 L = 0.5 m</text>
    <rect x="580" y="181" width="476" height="345" rx="16" fill="#f5f8f5" stroke="#cedcd5" stroke-width="2"/>
    <g font-size="26"><text x="605" y="231" font-weight="700">中点向前速度</text><text x="605" y="280">v = (0.3 + 0.1) ÷ 2</text><text x="605" y="322">= 0.2 m/s</text>
      <text x="605" y="389" font-weight="700">机身左转角速度</text><text x="605" y="438">ω = (0.3 − 0.1) ÷ 0.5</text><text x="605" y="480">= 0.4 rad/s</text></g>
    <text x="44" y="650" font-size="24" fill="#5d7269">这是轮式运动学教学模型，不能直接套到 Go2 等四足机器人。</text>
  </g>
</svg>
