<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
<title id="title">源码里的视觉概念：按职责辨认，不靠文件名猜</title><desc id="desc">把图像容器、图像变换、模型推理、几何估计和状态估计分开辨认。文件名不能单独证明后端、算法版本或自适应能力。</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#367660"/></marker></defs>
<rect width="1100" height="700" rx="22" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="42" y="58" font-size="30" font-weight="700" fill="#23463b" text-anchor="start">源码里的视觉概念：按职责辨认，不靠文件名猜</text>
<text x="42" y="105" font-size="23" font-weight="400" fill="#5d7269" text-anchor="start">各类工具的职责地图；不是专用检测、瞄准或控制流程图</text>
<rect x="44" y="154" width="478" height="155" rx="14" fill="#f4f8f5" stroke="#cedcd5" stroke-width="2"/>
<text x="64" y="194" font-size="26" font-weight="700" fill="#23463b" text-anchor="start">图像表示与采样</text>
<text x="64" y="237" font-size="23" font-weight="400" fill="#23463b" text-anchor="start">Mat、ROI、复制与通道</text>
<text x="64" y="273" font-size="23" font-weight="400" fill="#23463b" text-anchor="start">尺寸改变与插值</text>
<rect x="578" y="154" width="478" height="155" rx="14" fill="#e6f2eb" stroke="#cedcd5" stroke-width="2"/>
<text x="598" y="194" font-size="26" font-weight="700" fill="#23463b" text-anchor="start">学习模型与推理后端</text>
<text x="598" y="237" font-size="23" font-weight="400" fill="#23463b" text-anchor="start">模型描述与执行引擎是两回事</text>
<text x="598" y="273" font-size="23" font-weight="400" fill="#23463b" text-anchor="start">文件名 TRT 不等于 TensorRT</text>
<rect x="44" y="358" width="478" height="155" rx="14" fill="#f4f8f5" stroke="#cedcd5" stroke-width="2"/>
<text x="64" y="398" font-size="26" font-weight="700" fill="#23463b" text-anchor="start">几何与相机关系</text>
<text x="64" y="441" font-size="23" font-weight="400" fill="#23463b" text-anchor="start">图像平面变换与位姿不同</text>
<text x="64" y="477" font-size="23" font-weight="400" fill="#23463b" text-anchor="start">库接口不能替代数据前提</text>
<rect x="578" y="358" width="478" height="155" rx="14" fill="#e6f2eb" stroke="#cedcd5" stroke-width="2"/>
<text x="598" y="398" font-size="26" font-weight="700" fill="#23463b" text-anchor="start">估计与数学工具</text>
<text x="598" y="441" font-size="23" font-weight="400" fill="#23463b" text-anchor="start">滤波、矩阵、局部变化率</text>
<text x="598" y="477" font-size="23" font-weight="400" fill="#23463b" text-anchor="start">AdaptiveEkf 名称不证明自适应</text>
<rect x="44" y="560" width="1012" height="80" rx="14" fill="#f4f8f5" stroke="#cedcd5" stroke-width="2"/>
<text x="67" y="608" font-size="26" font-weight="700" fill="#23463b" text-anchor="start">判断顺序：实际调用 → 官方接口含义 → 数据前提 → 能确认的结论</text>
</g></svg>
