<text x="705" y="366" font-size="24" fill="#23463b" font-weight="400" text-anchor="start">d1 / d2 = 1 / 2 = 0.5</text>
<text x="705" y="419" font-size="25" fill="#23463b" font-weight="700" text-anchor="start">0.5 &lt; 0.75 → 通过</text>
<text x="705" y="479" font-size="24" fill="#5d7269" font-weight="400" text-anchor="start">并列最近 → 暂不匹配</text>
<text x="44" y="593" font-size="25" fill="#23463b" font-weight="700" text-anchor="start">通过筛选仍只是候选；重复纹理也可能造成错误匹配。</text>
<text x="44" y="640" font-size="23" fill="#5d7269" font-weight="400" text-anchor="start">关键点记录位置等属性；描述子概括附近外观。本图没有提取真实 ORB。</text>
</g></svg>
