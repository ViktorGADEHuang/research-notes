<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
<title id="title">特征匹配：先比较，再检查候选是否含糊</title>
<desc id="desc">手写八位查询描述子为一零一一零零一零。候选A、B、C的汉明距离分别为一、二、八，标色位为不同位。最佳与次佳距离比为零点五，小于教学门槛零点七五，因而通过候选筛选，但不能据此证明是真实对应。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#367660"/></marker></defs>
