<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="title">
<title id="title">读论文的四个问题</title>
<rect width="900" height="310" rx="16" fill="#f2f6f1"/>
<rect x="150" y="20" width="600" height="60" rx="12" fill="#24463c"/>
<text x="450" y="58" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="23">读论文的四个问题</text>
<path d="M450 80 V105 M150 105 H750 M150 105 V125 M450 105 V125 M750 105 V125" stroke="#789887" stroke-width="3" fill="none"/>
<rect x="20" y="125" width="260" height="155" rx="12" fill="#ffffff" stroke="#b7cbbb"/>
<text x="150" y="166" text-anchor="middle" fill="#24463c" font-family="sans-serif" font-size="21" font-weight="bold">问题与假设</text>
<text x="150" y="210" text-anchor="middle" fill="#3c5147" font-family="sans-serif" font-size="17">作者要解决什么</text>
<text x="150" y="244" text-anchor="middle" fill="#3c5147" font-family="sans-serif" font-size="17">成立需要哪些条件</text>
<rect x="320" y="125" width="260" height="155" rx="12" fill="#ffffff" stroke="#b7cbbb"/>
<text x="450" y="166" text-anchor="middle" fill="#24463c" font-family="sans-serif" font-size="21" font-weight="bold">方法与证据</text>
<text x="450" y="210" text-anchor="middle" fill="#3c5147" font-family="sans-serif" font-size="17">输入、输出、关键机制</text>
<text x="450" y="244" text-anchor="middle" fill="#3c5147" font-family="sans-serif" font-size="17">实验基线与评价指标</text>
<rect x="620" y="125" width="260" height="155" rx="12" fill="#ffffff" stroke="#b7cbbb"/>
<text x="750" y="166" text-anchor="middle" fill="#24463c" font-family="sans-serif" font-size="21" font-weight="bold">联系与限制</text>
<text x="750" y="210" text-anchor="middle" fill="#3c5147" font-family="sans-serif" font-size="17">对放牧任务有何启发</text>
<text x="750" y="244" text-anchor="middle" fill="#3c5147" font-family="sans-serif" font-size="17">缺少什么，怎样验证</text>
</svg>