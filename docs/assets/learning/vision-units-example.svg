<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 455" role="img" aria-labelledby="title desc">
<title id="title">从检测框到相机坐标，再到世界坐标</title>
<desc id="desc">像素坐标不是米制位置。需先处理畸变，结合相机内参和深度，得到相机坐标中的位置，再结合相机姿态和位置转换到世界坐标。算例中 u=420、cx=320、fx=500、Z=5米，X=1米。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#397b68"/></marker></defs>
<rect width="930" height="455" rx="16" fill="#f2f6f1"/>
<g font-family="'Microsoft YaHei',sans-serif" fill="#24463c">
<text x="30" y="48" font-size="25" font-weight="700">看见目标之后，还要说明位置在哪个坐标系</text>
<g fill="#fff" stroke="#b7cbbb"><rect x="25" y="90" width="267" height="240" rx="12"/><rect x="332" y="90" width="267" height="240" rx="12"/><rect x="639" y="90" width="267" height="240" rx="12"/></g>
<text x="44" y="128" font-size="22" font-weight="700">1 · 图像里的像素</text>
<rect x="51" y="151" width="84" height="78" fill="#deedc7" stroke="#397b68" stroke-width="2"/>
<circle cx="93" cy="190" r="5" fill="#397b68"/>
<text x="146" y="180" font-size="17">u = 420 像素</text>
<text x="44" y="266" font-size="17">检测框：看到了哪里</text><text x="44" y="298" font-size="17">还不能直接当成米</text>
<text x="351" y="128" font-size="22" font-weight="700">2 · 相机坐标位置</text>
<text x="351" y="176" font-size="18">内参：cₓ = 320，fₓ = 500</text>
<text x="351" y="208" font-size="18">光轴深度：Z = 5 米</text>
<text x="351" y="266" font-size="17">X = (420 − 320) × 5 / 500</text>
<text x="351" y="298" font-size="18" font-weight="700">横向位置 X = 1 米</text>
<text x="658" y="128" font-size="22" font-weight="700">3 · 世界坐标位置</text>
<text x="658" y="176" font-size="18">还需要相机的姿态、位置</text>
<text x="658" y="208" font-size="18">旋转，再加平移</text>
<text x="658" y="266" font-size="17">与机器人、目标区使用</text><text x="658" y="298" font-size="17">同一坐标系后才能比较</text>
<path d="M296 210H324" stroke="#397b68" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M603 210H631" stroke="#397b68" stroke-width="3" marker-end="url(#arrow)"/>
<text x="30" y="377" font-size="18" font-weight="700">算例前提：针孔模型，像素已去畸变，Z 是沿光轴的深度。</text>
<text x="30" y="414" font-size="17">X 不是到相机的总距离；框中心也不一定对应羊身上的固定三维点。</text>
</g></svg>
