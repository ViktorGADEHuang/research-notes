<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">03 · 通道顺序与数值尺度，是两件事</title><desc id="desc">同一颜色的RGB表示为二百一百五十，BGR表示为五十一百二百。按零点二九九R加零点五八七G加零点一一四B计算，灰度为一百二十四点二。归一化把数值除以二百五十五。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#367660"/></marker></defs>
<rect width="1100" height="680" rx="22" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="42" y="59" font-size="31" fill="#23463b" font-weight="700" text-anchor="start">03 · 通道顺序与数值尺度，是两件事</text>
<text x="42" y="106" font-size="24" fill="#5d7269" font-weight="400" text-anchor="start">先写明 RGB / BGR，再写明范围；不要靠数组长度猜颜色含义</text>
<rect x="32" y="145" width="508" height="220" rx="16" fill="#f2f7f2" stroke="#c9dbcf" stroke-width="2"/>
<text x="60" y="188" font-size="27" fill="#23463b" font-weight="700" text-anchor="start">RGB：红、绿、蓝</text>
<rect x="60" y="213" width="140" height="95" rx="10" fill="#bc524c" stroke="#bc524c" stroke-width="2"/>
<text x="130" y="249" font-size="25" fill="#fff" font-weight="700" text-anchor="middle">R</text>
<text x="130" y="288" font-size="29" fill="#fff" font-weight="700" text-anchor="middle">200</text>
<rect x="215" y="213" width="140" height="95" rx="10" fill="#4b7d55" stroke="#4b7d55" stroke-width="2"/>
<text x="285" y="249" font-size="25" fill="#fff" font-weight="700" text-anchor="middle">G</text>
<text x="285" y="288" font-size="29" fill="#fff" font-weight="700" text-anchor="middle">100</text>
<rect x="370" y="213" width="140" height="95" rx="10" fill="#4f6fa3" stroke="#4f6fa3" stroke-width="2"/>
<text x="440" y="249" font-size="25" fill="#fff" font-weight="700" text-anchor="middle">B</text>
<text x="440" y="288" font-size="29" fill="#fff" font-weight="700" text-anchor="middle">50</text>
<text x="286" y="343" font-size="24" fill="#3b564a" font-weight="400" text-anchor="middle">同一种颜色，只改变排列</text>
<rect x="560" y="145" width="508" height="220" rx="16" fill="#f2f7f2" stroke="#c9dbcf" stroke-width="2"/>
<text x="588" y="188" font-size="27" fill="#23463b" font-weight="700" text-anchor="start">BGR：蓝、绿、红</text>
<rect x="588" y="213" width="140" height="95" rx="10" fill="#4f6fa3" stroke="#4f6fa3" stroke-width="2"/>
<text x="658" y="249" font-size="25" fill="#fff" font-weight="700" text-anchor="middle">B</text>
<text x="658" y="288" font-size="29" fill="#fff" font-weight="700" text-anchor="middle">50</text>
<rect x="743" y="213" width="140" height="95" rx="10" fill="#4b7d55" stroke="#4b7d55" stroke-width="2"/>
<text x="813" y="249" font-size="25" fill="#fff" font-weight="700" text-anchor="middle">G</text>
<text x="813" y="288" font-size="29" fill="#fff" font-weight="700" text-anchor="middle">100</text>
<rect x="898" y="213" width="140" height="95" rx="10" fill="#bc524c" stroke="#bc524c" stroke-width="2"/>
<text x="968" y="249" font-size="25" fill="#fff" font-weight="700" text-anchor="middle">R</text>
<text x="968" y="288" font-size="29" fill="#fff" font-weight="700" text-anchor="middle">200</text>
<text x="814" y="343" font-size="24" fill="#3b564a" font-weight="400" text-anchor="middle">同一种颜色，只改变排列</text>
<rect x="32" y="394" width="625" height="210" rx="16" fill="#f2f7f2" stroke="#c9dbcf" stroke-width="2"/>
<text x="62" y="437" font-size="27" fill="#23463b" font-weight="700" text-anchor="start">按约定的加权式转灰度</text>
<text x="62" y="481" font-size="27" fill="#23463b" font-weight="400" text-anchor="start">Y = 0.299R + 0.587G + 0.114B</text>
<text x="62" y="523" font-size="25" fill="#3b564a" font-weight="400" text-anchor="start">贡献：59.8 + 58.7 + 5.7</text>
<text x="62" y="571" font-size="30" fill="#23463b" font-weight="700" text-anchor="start">灰度 Y = 124.2</text>
<rect x="685" y="394" width="383" height="210" rx="16" fill="#f2f7f2" stroke="#c9dbcf" stroke-width="2"/>
<text x="715" y="437" font-size="25" fill="#23463b" font-weight="700" text-anchor="start">范围：0～255 → 0～1</text>
<text x="715" y="486" font-size="25" fill="#3b564a" font-weight="400" text-anchor="start">把每个值除以 255</text>
<text x="715" y="531" font-size="26" fill="#23463b" font-weight="700" text-anchor="start">128 / 255 ≈ 0.502</text>
<text x="715" y="575" font-size="24" fill="#3b564a" font-weight="400" text-anchor="start">类型转换不等于归一化</text>
<text x="42" y="647" font-size="25" fill="#23463b" font-weight="400" text-anchor="start">灰度换算会丢失颜色信息；这里的灰度近似不是物理照度。</text>
</g></svg>
