<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
<title id="title">像素表：先行后列，不要把坐标写反</title><desc id="desc">三乘三灰度图，行列从零开始。第1行第2列为六十，对应横纵坐标二、一。阈值大于或等于五十时输出二百五十五。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#367660"/></marker></defs>
<rect width="1100" height="680" rx="22" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="42" y="59" font-size="31" fill="#23463b" font-weight="700" text-anchor="start">像素表：先行后列，不要把坐标写反</text>
<text x="42" y="105" font-size="23" fill="#5d7269" font-weight="400" text-anchor="start">虚构灰度图 · 数字越大越亮 · 本例的像素坐标不代表米</text>
<text x="208" y="178" font-size="24" fill="#23463b" font-weight="400" text-anchor="middle">列 0</text>
<text x="324" y="178" font-size="24" fill="#23463b" font-weight="400" text-anchor="middle">列 1</text>
<text x="440" y="178" font-size="24" fill="#23463b" font-weight="400" text-anchor="middle">列 2</text>
<text x="67" y="254" font-size="24" fill="#23463b" font-weight="400" text-anchor="start">行 0</text>
<rect x="158" y="204" width="100" height="90" rx="14" fill="#edf3ee" stroke="#cedcd5" stroke-width="2"/>
<text x="208" y="261" font-size="32" fill="#23463b" font-weight="700" text-anchor="middle">10</text>
<rect x="274" y="204" width="100" height="90" rx="14" fill="#edf3ee" stroke="#cedcd5" stroke-width="2"/>
<text x="324" y="261" font-size="32" fill="#23463b" font-weight="700" text-anchor="middle">20</text>
<rect x="390" y="204" width="100" height="90" rx="14" fill="#edf3ee" stroke="#cedcd5" stroke-width="2"/>
<text x="440" y="261" font-size="32" fill="#23463b" font-weight="700" text-anchor="middle">30</text>
<text x="67" y="359" font-size="24" fill="#23463b" font-weight="400" text-anchor="start">行 1</text>
<rect x="158" y="309" width="100" height="90" rx="14" fill="#edf3ee" stroke="#cedcd5" stroke-width="2"/>
<text x="208" y="366" font-size="32" fill="#23463b" font-weight="700" text-anchor="middle">40</text>
<rect x="274" y="309" width="100" height="90" rx="14" fill="#edf3ee" stroke="#cedcd5" stroke-width="2"/>
<text x="324" y="366" font-size="32" fill="#23463b" font-weight="700" text-anchor="middle">50</text>
<rect x="390" y="309" width="100" height="90" rx="14" fill="#bcdcc9" stroke="#cedcd5" stroke-width="2"/>
<text x="440" y="366" font-size="32" fill="#23463b" font-weight="700" text-anchor="middle">60</text>
<text x="67" y="464" font-size="24" fill="#23463b" font-weight="400" text-anchor="start">行 2</text>
<rect x="158" y="414" width="100" height="90" rx="14" fill="#edf3ee" stroke="#cedcd5" stroke-width="2"/>
<text x="208" y="471" font-size="32" fill="#23463b" font-weight="700" text-anchor="middle">70</text>
<rect x="274" y="414" width="100" height="90" rx="14" fill="#edf3ee" stroke="#cedcd5" stroke-width="2"/>
<text x="324" y="471" font-size="32" fill="#23463b" font-weight="700" text-anchor="middle">80</text>
<rect x="390" y="414" width="100" height="90" rx="14" fill="#edf3ee" stroke="#cedcd5" stroke-width="2"/>
<text x="440" y="471" font-size="32" fill="#23463b" font-weight="700" text-anchor="middle">90</text>
<rect x="574" y="170" width="482" height="156" rx="14" fill="#e6f2eb" stroke="#cedcd5" stroke-width="2"/>
<text x="594" y="210" font-size="25" fill="#23463b" font-weight="700" text-anchor="start">找到数字 60</text>
<text x="594" y="250" font-size="22" fill="#5d7269" font-weight="400" text-anchor="start">数组：image[1][2]</text>
<text x="594" y="284" font-size="22" fill="#5d7269" font-weight="400" text-anchor="start">坐标：(u, v) = (2, 1)</text>
<rect x="574" y="365" width="482" height="171" rx="14" fill="#f4f8f5" stroke="#cedcd5" stroke-width="2"/>
<text x="598" y="406" font-size="25" fill="#23463b" font-weight="700" text-anchor="start">阈值规则：亮度 ≥ 50 → 255</text>
<text x="598" y="448" font-size="26" fill="#23463b" font-weight="400" text-anchor="start">第二行：40、50、60</text>
<text x="598" y="491" font-size="26" fill="#23463b" font-weight="400" text-anchor="start">输出：    0、255、255</text>
<text x="44" y="620" font-size="24" fill="#23463b" font-weight="400" text-anchor="start">九个数的平均值为 50；亮度满足规则，不等于已经识别出物体类别。</text>
</g></svg>
