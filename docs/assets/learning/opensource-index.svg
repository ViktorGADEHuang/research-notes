<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="title">
<title id="title">资源要带着问题用</title>
<rect width="900" height="310" rx="16" fill="#f2f6f1"/>
<rect x="150" y="20" width="600" height="60" rx="12" fill="#24463c"/>
<text x="450" y="58" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="23">资源要带着问题用</text>
<path d="M450 80 V105 M150 105 H750 M150 105 V125 M450 105 V125 M750 105 V125" stroke="#789887" stroke-width="3" fill="none"/>
<rect x="20" y="125" width="260" height="155" rx="12" fill="#ffffff" stroke="#b7cbbb"/>
<text x="150" y="166" text-anchor="middle" fill="#24463c" font-family="sans-serif" font-size="21" font-weight="bold">先确定目标</text>
<text x="150" y="210" text-anchor="middle" fill="#3c5147" font-family="sans-serif" font-size="17">学理论还是读实现</text>
<text x="150" y="244" text-anchor="middle" fill="#3c5147" font-family="sans-serif" font-size="17">环境与工具是否匹配</text>
<rect x="320" y="125" width="260" height="155" rx="12" fill="#ffffff" stroke="#b7cbbb"/>
<text x="450" y="166" text-anchor="middle" fill="#24463c" font-family="sans-serif" font-size="21" font-weight="bold">查原始资料</text>
<text x="450" y="210" text-anchor="middle" fill="#3c5147" font-family="sans-serif" font-size="17">官方文档与论文</text>
<text x="450" y="244" text-anchor="middle" fill="#3c5147" font-family="sans-serif" font-size="17">对照版本与接口</text>
<rect x="620" y="125" width="260" height="155" rx="12" fill="#ffffff" stroke="#b7cbbb"/>
<text x="750" y="166" text-anchor="middle" fill="#24463c" font-family="sans-serif" font-size="21" font-weight="bold">形成自己的记录</text>
<text x="750" y="210" text-anchor="middle" fill="#3c5147" font-family="sans-serif" font-size="17">最小例子与笔记</text>
<text x="750" y="244" text-anchor="middle" fill="#3c5147" font-family="sans-serif" font-size="17">保留来源与限制</text>
</svg>