<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="title">
<title id="title">视觉把图像转为状态</title>
<rect width="900" height="310" rx="16" fill="#f2f6f1"/>
<rect x="150" y="20" width="600" height="60" rx="12" fill="#24463c"/>
<text x="450" y="58" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="23">视觉把图像转为状态</text>
<path d="M450 80 V105 M150 105 H750 M150 105 V125 M450 105 V125 M750 105 V125" stroke="#789887" stroke-width="3" fill="none"/>
<rect x="20" y="125" width="260" height="155" rx="12" fill="#ffffff" stroke="#b7cbbb"/>
<text x="150" y="166" text-anchor="middle" fill="#24463c" font-family="sans-serif" font-size="21" font-weight="bold">图像与检测</text>
<text x="150" y="210" text-anchor="middle" fill="#3c5147" font-family="sans-serif" font-size="17">采集、曝光、标定</text>
<text x="150" y="244" text-anchor="middle" fill="#3c5147" font-family="sans-serif" font-size="17">识别羊的位置框</text>
<rect x="320" y="125" width="260" height="155" rx="12" fill="#ffffff" stroke="#b7cbbb"/>
<text x="450" y="166" text-anchor="middle" fill="#24463c" font-family="sans-serif" font-size="21" font-weight="bold">跟踪与估计</text>
<text x="450" y="210" text-anchor="middle" fill="#3c5147" font-family="sans-serif" font-size="17">关联同一只羊</text>
<text x="450" y="244" text-anchor="middle" fill="#3c5147" font-family="sans-serif" font-size="17">转换坐标与估计位置</text>
<rect x="620" y="125" width="260" height="155" rx="12" fill="#ffffff" stroke="#b7cbbb"/>
<text x="750" y="166" text-anchor="middle" fill="#24463c" font-family="sans-serif" font-size="21" font-weight="bold">输出与检查</text>
<text x="750" y="210" text-anchor="middle" fill="#3c5147" font-family="sans-serif" font-size="17">时间戳和延迟</text>
<text x="750" y="244" text-anchor="middle" fill="#3c5147" font-family="sans-serif" font-size="17">遮挡、漏检、身份切换</text>
</svg>