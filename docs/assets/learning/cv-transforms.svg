<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">04 · 裁剪换原点，插值估计新位置的值</title><desc id="desc">原图四列三行，裁剪横向一到四不含四、纵向一到三不含三，得到两行三列。局部一零对应原图二一。另一组四角灰度零一百二百二百四十，在横向四分之一纵向二分之一处双线性插值为一百一十七点五。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#367660"/></marker></defs>
<rect width="1100" height="680" rx="22" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="42" y="59" font-size="31" fill="#23463b" font-weight="700" text-anchor="start">04 · 裁剪换原点，插值估计新位置的值</text>
<text x="42" y="106" font-size="24" fill="#5d7269" font-weight="400" text-anchor="start">左侧是裁剪；右侧是另一块专门用于手算插值的小格</text>
<rect x="32" y="145" width="500" height="451" rx="16" fill="#f2f7f2" stroke="#c9dbcf" stroke-width="2"/>
<text x="62" y="187" font-size="25" fill="#23463b" font-weight="700" text-anchor="start">ROI：x ∈ [1,4)，y ∈ [1,3)</text>
