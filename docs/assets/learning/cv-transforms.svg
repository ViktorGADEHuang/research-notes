<rect x="766" y="294" width="227" height="61" rx="8" fill="#fff" stroke="#c9dbcf" stroke-width="2"/>
<text x="780" y="332" font-size="23" fill="#23463b" font-weight="700" text-anchor="start">a=0.25，b=0.5</text>
<text x="590" y="485" font-size="24" fill="#3b564a" font-weight="400" text-anchor="start">上行估计 25；下行估计 210</text>
<text x="590" y="530" font-size="25" fill="#3b564a" font-weight="400" text-anchor="start">25×0.5 + 210×0.5</text>
<text x="590" y="575" font-size="31" fill="#23463b" font-weight="700" text-anchor="start">= 117.5</text>
<text x="42" y="646" font-size="24" fill="#23463b" font-weight="400" text-anchor="start">插值用已有采样估计数值；放大图片不会恢复当时没有拍到的真实细节。</text>
</g></svg>
