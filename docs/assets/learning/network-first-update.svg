<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 510" role="img" aria-labelledby="title desc">
<title id="title">同一输入和目标，怎样通过梯度调整两个参数</title>
<desc id="desc">输入 x=2、目标为3。旧参数 w=0.5、b=0 给出预测1、损失4。梯度为 w的负8与b的负4。学习率0.05，更新后w=0.9、b=0.2，重新预测得到2、损失1。计算梯度与更新参数是不同步骤。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#397b68"/></marker></defs>
<rect width="940" height="510" rx="16" fill="#f2f6f1"/>
<g font-family="'Microsoft YaHei',sans-serif" fill="#24463c">
<text x="30" y="48" font-size="25" font-weight="700">只调整参数，输入和本次参考目标保持不变</text>
<text x="30" y="83" font-size="18">预测函数：ŷ = w × x + b；损失：L = (ŷ − 目标)²</text>
<g fill="#fff" stroke="#b7cbbb"><rect x="30" y="115" width="262" height="134" rx="12"/><rect x="340" y="115" width="262" height="134" rx="12"/><rect x="650" y="115" width="262" height="134" rx="12"/></g>
<text x="50" y="152" font-size="21" font-weight="700">1 · 用旧参数预测</text>
<text x="50" y="188" font-size="18">x = 2，w = 0.5，b = 0</text>
<text x="50" y="224" font-size="18">预测：0.5 × 2 + 0 = 1</text>
<text x="360" y="152" font-size="21" font-weight="700">2 · 与目标比较</text>
<text x="360" y="188" font-size="18">目标 3，误差 1 − 3 = −2</text>
<text x="360" y="224" font-size="18">平方损失：(−2)² = 4</text>
<text x="670" y="152" font-size="21" font-weight="700">3 · 计算两个梯度</text>
<text x="670" y="188" font-size="18">w：2 × (−2) × 2 = −8</text>
<text x="670" y="224" font-size="18">b：2 × (−2) = −4</text>
<path d="M298 181H332" stroke="#397b68" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M608 181H642" stroke="#397b68" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M781 254V289H240V319" stroke="#397b68" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="100" y="330" width="390" height="116" rx="12" fill="#deedc7" stroke="#b7cbbb"/>
<text x="120" y="366" font-size="21" font-weight="700">4 · 梯度下降，学习率 0.05</text>
<text x="120" y="398" font-size="18">w = 0.5 − 0.05 × (−8) = 0.9</text>
<text x="120" y="430" font-size="18">b = 0 − 0.05 × (−4) = 0.2</text>
<rect x="540" y="330" width="340" height="116" rx="12" fill="#fff" stroke="#b7cbbb"/>
<text x="560" y="366" font-size="21" font-weight="700">5 · 再用同一输入预测</text>
<text x="560" y="398" font-size="18">预测：0.9 × 2 + 0.2 = 2</text>
<text x="560" y="430" font-size="18">新损失：(2 − 3)² = 1</text>
<path d="M496 388H532" stroke="#397b68" stroke-width="3" marker-end="url(#arrow)"/>
<text x="30" y="485" font-size="17">这是一次算术演示，不是强化学习训练；下一次更新要重新计算梯度。</text>
</g></svg>
