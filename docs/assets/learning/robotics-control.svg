<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="img" aria-labelledby="title desc">
<title id="title">反馈控制：执行后的测量返回下一轮</title>
<desc id="desc">目标减去反馈位置得到误差，PID 计算速度，经过上下限后执行，再测量位置。下方解释积分积累与时间间隔。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#3c6c5b"/></marker></defs>
<rect width="1080" height="660" rx="22" fill="#fbfcf9"/>
<g font-family="Microsoft YaHei, Segoe UI, sans-serif" fill="#233e34">
<text x="42" y="57" font-size="28" font-weight="700">每一次计算，都要知道最新反馈</text>
<text x="42" y="92" font-size="18" fill="#5a7066">一维位置 → 速度的教学模型；不包含电机力矩与四足平衡</text>
<g fill="#e8f1e9" stroke="#83a08b" stroke-width="2">
<rect x="40" y="175" width="205" height="130" rx="15"/>
<rect x="310" y="175" width="205" height="130" rx="15"/>
<rect x="580" y="175" width="205" height="130" rx="15"/>
<rect x="850" y="175" width="190" height="130" rx="15"/>
</g>
<g text-anchor="middle">
<text x="142" y="211" font-size="21" font-weight="700">目标 − 反馈</text>
<text x="142" y="248" font-size="19">e = x* − x</text>
<text x="142" y="281" font-size="17">误差：米</text>
<text x="412" y="211" font-size="21" font-weight="700">P / I / D</text>
<text x="412" y="248" font-size="18">当前 / 累计 / 变化</text>
<text x="412" y="281" font-size="17">原始速度：米/秒</text>
<text x="682" y="211" font-size="21" font-weight="700">限制输出</text>
<text x="682" y="248" font-size="19">−0.5 至 +0.5</text>
<text x="682" y="281" font-size="17">教学速度上限</text>
<text x="945" y="211" font-size="21" font-weight="700">执行 + 测量</text>
<text x="945" y="248" font-size="19">实际到了哪里？</text>
<text x="945" y="281" font-size="17">保留时间与单位</text>
</g>
<g fill="none" stroke="#3c6c5b" stroke-width="3" marker-end="url(#arrow)">
<path d="M245 237 H300"/><path d="M515 237 H570"/><path d="M785 237 H840"/>
<path d="M945 305 V392 H142 V315"/>
</g>
<rect x="307" y="368" width="463" height="48" rx="15" fill="#fbfcf9"/>
<text x="538" y="398" text-anchor="middle" font-size="21" font-weight="700">新反馈返回，下一轮重新计算</text>
<rect x="40" y="455" width="485" height="150" rx="15" fill="#f0f3ec"/>
<text x="62" y="491" font-size="21" font-weight="700">积分：误差也有“持续时间”</text>
<text x="62" y="528" font-size="19">0.2 米 × 0.1 秒 = 0.02 米·秒</text>
<text x="62" y="565" font-size="18">饱和时，不能继续盲目增加积分。</text>
<rect x="555" y="455" width="485" height="150" rx="15" fill="#f0f3ec"/>
<text x="577" y="491" font-size="21" font-weight="700">微分：两次误差差多少？</text>
<text x="577" y="528" font-size="19">(0.2 − 0.3) 米 ÷ 0.1 秒 = −1 米/秒</text>
<text x="577" y="565" font-size="18">噪声和错误时间间隔会影响变化率。</text>
</g></svg>
