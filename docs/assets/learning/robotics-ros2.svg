<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 650" role="img" aria-labelledby="title desc">
<title id="title">ROS 2：两个节点交换消息</title><desc id="desc">发送节点由定时器调用回调，创建 String 消息并发布到 learning chatter 话题；接收节点的回调读取 data 字段。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#316a59"/></marker></defs>
<rect width="1080" height="650" rx="20" fill="#fff"/>
<g font-family="Microsoft YaHei, Segoe UI, sans-serif" fill="#21473c">
<text x="36" y="60" font-size="34" font-weight="bold" text-anchor="start" fill="#21473c">一句话怎样从一个程序到另一个程序？</text>
<rect x="36" y="112" width="280" height="202" rx="15" fill="#f1f7f3" stroke="#a9c8b9" stroke-width="2"/>
<text x="56" y="156" font-size="30" font-weight="bold" text-anchor="start" fill="#21473c">发送节点</text>
<text x="56" y="198" font-size="26" font-weight="normal" text-anchor="start" fill="#21473c">learning_talker</text>
<text x="56" y="236" font-size="26" font-weight="normal" text-anchor="start" fill="#21473c">定时器：约每 1 秒</text>
<text x="56" y="274" font-size="26" font-weight="normal" text-anchor="start" fill="#21473c">回调：创建并发布</text>
<rect x="378" y="112" width="324" height="202" rx="15" fill="#f1f7f3" stroke="#a9c8b9" stroke-width="2"/>
<text x="398" y="156" font-size="30" font-weight="bold" text-anchor="start" fill="#21473c">共同的话题</text>
<text x="398" y="198" font-size="26" font-weight="normal" text-anchor="start" fill="#21473c">/learning/chatter</text>
<text x="398" y="236" font-size="26" font-weight="normal" text-anchor="start" fill="#21473c">String 消息</text>
<text x="398" y="274" font-size="26" font-weight="normal" text-anchor="start" fill="#21473c">data = &quot;hello 0&quot;</text>
<rect x="764" y="112" width="280" height="202" rx="15" fill="#f1f7f3" stroke="#a9c8b9" stroke-width="2"/>
<text x="784" y="156" font-size="30" font-weight="bold" text-anchor="start" fill="#21473c">接收节点</text>
<text x="784" y="198" font-size="26" font-weight="normal" text-anchor="start" fill="#21473c">learning_listener</text>
<text x="784" y="236" font-size="26" font-weight="normal" text-anchor="start" fill="#21473c">订阅相同话题</text>
<text x="784" y="274" font-size="26" font-weight="normal" text-anchor="start" fill="#21473c">回调：读取并打印</text>
<path d="M324 213 L368 213" fill="none" stroke="#316a59" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M710 213 L754 213" fill="none" stroke="#316a59" stroke-width="3" marker-end="url(#arrow)"/>
<text x="36" y="373" font-size="30" font-weight="bold" text-anchor="start" fill="#21473c">初始化 → 创建节点 → 登记回调 → spin 处理事件</text>
<rect x="36" y="412" width="486" height="143" rx="15" fill="#f1f7f3" stroke="#a9c8b9" stroke-width="2"/>
<text x="56" y="456" font-size="30" font-weight="bold" text-anchor="start" fill="#21473c">周期不是历史深度</text>
<text x="56" y="498" font-size="26" font-weight="normal" text-anchor="start" fill="#21473c">1.0：定时器周期，单位秒</text>
<text x="56" y="536" font-size="26" font-weight="normal" text-anchor="start" fill="#21473c">10：KEEP_LAST 历史深度</text>
<rect x="558" y="412" width="486" height="143" rx="15" fill="#f1f7f3" stroke="#a9c8b9" stroke-width="2"/>
<text x="578" y="456" font-size="30" font-weight="bold" text-anchor="start" fill="#21473c">分别核对两端</text>
<text x="578" y="498" font-size="26" font-weight="normal" text-anchor="start" fill="#21473c">类型、话题与通信设置对应</text>
<text x="578" y="536" font-size="26" font-weight="normal" text-anchor="start" fill="#21473c">发送日志 ≠ 已成功收到</text>
<text x="36" y="614" font-size="29" font-weight="normal" text-anchor="start" fill="#21473c">本例只交换文字；没有机器人运动指令。</text>
</g></svg>
