<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">CMake：从手写文件到程序输出</title>
  <desc id="desc">用户写 main.cpp 与 CMakeLists.txt。第一步配置生成 build 目录的构建规则，第二步构建调用编译器与链接器生成 hello 程序，第三步运行显示 Hello, CMake。配置成功不等于程序已经生成。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#397b68"/></marker></defs>
  <rect width="920" height="560" rx="18" fill="#f2f6f1"/>
  <g font-family="'Microsoft YaHei',sans-serif" fill="#24463c">
    <text x="40" y="49" font-size="25" font-weight="700">先写两个文件，再完成三个步骤</text>
    <text x="40" y="83" font-size="17" fill="#61706b">每个步骤有不同产物；看到哪一步成功，就确认到哪一步。</text>
    <rect x="40" y="112" width="405" height="100" rx="12" fill="#fff" stroke="#b7cbbb"/>
    <text x="62" y="149" font-size="22" font-weight="700">main.cpp</text>
    <text x="62" y="184" font-size="18">程序的内容：输出 Hello, CMake!</text>
    <rect x="475" y="112" width="405" height="100" rx="12" fill="#fff" stroke="#b7cbbb"/>
    <text x="497" y="149" font-size="22" font-weight="700">CMakeLists.txt</text>
    <text x="497" y="184" font-size="18">构建说明：用 main.cpp 生成 hello</text>
    <path d="M678 216V245H174V274" stroke="#397b68" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <g fill="#fff" stroke="#b7cbbb"><rect x="40" y="284" width="252" height="174" rx="12"/><rect x="334" y="284" width="252" height="174" rx="12"/><rect x="628" y="284" width="252" height="174" rx="12"/></g>
    <text x="60" y="322" font-size="23" font-weight="700">1 · 配置</text>
    <text x="60" y="358" font-size="18">读取构建说明</text>
    <text x="60" y="389" font-size="18">检查工具，生成规则</text>
    <text x="60" y="432" font-size="16">产物：build/ 中的规则</text>
    <text x="354" y="322" font-size="23" font-weight="700">2 · 构建</text>
    <text x="354" y="358" font-size="18">编译 main.cpp</text>
    <text x="354" y="389" font-size="18">链接成可执行程序</text>
    <text x="354" y="432" font-size="16">产物：hello.exe / hello</text>
    <text x="648" y="322" font-size="23" font-weight="700">3 · 运行</text>
    <text x="648" y="358" font-size="18">启动生成的程序</text>
    <text x="648" y="389" font-size="18">执行 main 中的代码</text>
    <text x="648" y="432" font-size="16">结果：Hello, CMake!</text>
    <path d="M297 370H327" stroke="#397b68" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M591 370H621" stroke="#397b68" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="40" y="507" font-size="18" font-weight="700">修改后的正确顺序：保存 → 构建成功 → 运行新程序</text>
    <text x="40" y="539" font-size="16" fill="#61706b">构建失败时，旧程序可能仍然存在；运行旧文件不能验证这次修改。</text>
  </g>
</svg>
