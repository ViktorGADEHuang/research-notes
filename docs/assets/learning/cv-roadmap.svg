<path d="M708 295 L755 295" stroke="#367660" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="489" width="1020" height="125" rx="12" fill="#e6f2eb" stroke="#cedcd5" stroke-width="2"/>
<text x="64" y="532" font-size="25" font-weight="700" fill="#23463b" text-anchor="start">每课三步：看图讲直觉 → 用数字手算 → 读注释代码与预期输出</text>
