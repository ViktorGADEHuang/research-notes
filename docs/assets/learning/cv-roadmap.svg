<text x="40" y="60" font-size="30" font-weight="700" fill="#23463b" text-anchor="start">视觉学习路线：先看懂数字，再判断结果</text>
<text x="40" y="106" font-size="23" font-weight="400" fill="#5d7269" text-anchor="start">14 章独立基础课 · 固定小例子 · 从输入、处理走到输出与检查</text>
