<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
<title id="title">视觉学习路线：先看懂数字，再判断结果</title><desc id="desc">十四章分三个阶段：第一至四章认识图像，第五至八章理解处理和几何，第九至十四章学习网络、检测、跟踪、评估及应用。每课先图解，再手算，最后对照注释代码。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#367660"/></marker></defs>
