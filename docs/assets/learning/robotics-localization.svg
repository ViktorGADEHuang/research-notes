<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="img" aria-labelledby="title desc">
<title id="title">定位与里程计：连续累计与地图修正</title>
<desc id="desc">map 到 odom 是定位修正，odom 到 base_link 是里程计运动估计。示例保留里程计 1.10 米，通过负 0.16 米平移得到地图位置 0.94 米。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#3c6c5b"/></marker></defs>
<rect width="1080" height="660" rx="22" fill="#fbfcf9"/>
<g font-family="Microsoft YaHei, Segoe UI, sans-serif" fill="#233e34">
<text x="42" y="57" font-size="28" font-weight="700">局部记账，参考观测帮助修正</text>
<text x="42" y="92" font-size="18" fill="#5a7066">以下数值只表示一维、轴同向、同时刻的教学例子</text>
<g fill="#e8f1e9" stroke="#83a08b" stroke-width="2">
<rect x="50" y="170" width="230" height="115" rx="15"/>
<rect x="425" y="170" width="230" height="115" rx="15"/>
<rect x="800" y="170" width="230" height="115" rx="15"/>
</g>
<g text-anchor="middle">
<text x="165" y="210" font-size="25" font-weight="700">map</text><text x="165" y="249" font-size="18">地图参考环境</text>
<text x="540" y="210" font-size="25" font-weight="700">odom</text><text x="540" y="249" font-size="18">连续，但可能漂移</text>
<text x="915" y="210" font-size="25" font-weight="700">base_link</text><text x="915" y="249" font-size="18">随机器人运动</text>
<text x="353" y="191" font-size="18">定位修正</text><text x="728" y="191" font-size="18">运动累计</text>
</g>
<g stroke="#3c6c5b" stroke-width="3" marker-end="url(#arrow)"><path d="M280 227 H413"/><path d="M655 227 H788"/></g>
<rect x="50" y="330" width="465" height="213" rx="15" fill="#f0f3ec"/>
<text x="74" y="369" font-size="22" font-weight="700">给定预测与观测</text>
<text x="74" y="411" font-size="20">预测：1.10 米，方差 0.04 米²</text>
<text x="74" y="451" font-size="20">观测：0.90 米，方差 0.01 米²</text>
<text x="74" y="498" font-size="19">K = 0.04 ÷ (0.04 + 0.01) = 0.8</text>
<rect x="565" y="330" width="465" height="213" rx="15" fill="#f0f3ec"/>
<text x="589" y="369" font-size="22" font-weight="700">保存估计和坐标修正</text>
<text x="589" y="411" font-size="20">地图位置：1.10 + 0.8 × (−0.20)</text>
<text x="589" y="451" font-size="23" font-weight="700">0.94 米 = −0.16 米 + 1.10 米</text>
<text x="589" y="498" font-size="19">估计跳变，不等于机器人瞬间移动。</text>
<rect x="50" y="574" width="980" height="49" rx="12" fill="#dcead9"/>
<text x="540" y="605" text-anchor="middle" font-size="20">融合前先检查：同一坐标系 · 同一时刻 · 单位一致 · 误差模型合理</text>
</g></svg>
